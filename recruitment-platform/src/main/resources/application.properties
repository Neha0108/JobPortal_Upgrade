# ===================== APPLICATION =====================
spring.application.name=recruitment-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://localhost:5432/recruitment_platform
spring.datasource.username=postgres
spring.datasource.password=Neha@74191
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=RecruitmentHikariCP

# ===================== JPA / HIBERNATE =====================
# Flyway owns the schema - Hibernate must never auto-modify it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================== FLYWAY =====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================== REDIS =====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ===================== CACHE =====================
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ===================== MAIL =====================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

# ===================== MULTIPART / FILE UPLOAD =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================== SERVER =====================
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ===================== JWT (custom, bound via JwtProperties) =====================
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-must-be-at-least-256-bits-long-xxxxxxxxxxxx}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.issuer=recruitment-platform

# ===================== CORS (custom, bound via CorsProperties) =====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ===================== FILE STORAGE (custom, bound via FileStorageProperties) =====================
app.file-storage.strategy=local
app.file-storage.local.base-path=${FILE_STORAGE_PATH:./uploads}
app.file-storage.allowed-content-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document
app.file-storage.max-file-size-bytes=5242880

# ===================== AI / GEMINI (custom, bound via GeminiProperties) =====================
app.ai.provider=gemini
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.model=gemini-2.0-flash
app.ai.gemini.timeout-ms=30000

# ===================== EMAIL (custom, bound via EmailProperties) =====================
app.email.from-address=${MAIL_FROM:no-reply@recruitmentplatform.com}
app.email.from-name=Recruitment Platform
app.email.frontend-base-url=${FRONTEND_URL:http://localhost:3000}
app.email.verification-token-expiry-minutes=60
app.email.password-reset-token-expiry-minutes=30

# ===================== SWAGGER / OPENAPI =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ===================== LOGGING =====================
logging.level.root=INFO
logging.level.com.recruitment.platform=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN