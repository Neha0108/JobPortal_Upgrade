<div class="not-found-page">

            <i class="fas fa-compass"></i>

        </div>

        <div class="error-code">

            404

        </div>

        <h1>

            Page Not Found

        </h1>

        <p>

        </p>

                class="btn btn-secondary"

        <div class="help-links">

            <a routerLink="/candidate/dashboard">
