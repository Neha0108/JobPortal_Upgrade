<div class="section">

    <div class="header">

        <h2>Recent Applications</h2>

        <span>{{applications.length}} Applied</span>

    </div>

    <div
        class="application-card"
        *ngFor="let application of applications">

        <div>

            <h3>{{application.jobTitle}}</h3>

            <p>

                Applied on

                {{application.appliedAt | date:'dd MMM yyyy'}}

            </p>

        </div>

        <div class="status">

            <span
                class="badge"

                [ngClass]="{

                pending:application.status=='PENDING',

                accepted:application.status=='ACCEPTED',

                rejected:application.status=='REJECTED',

                reviewed:application.status=='REVIEWED'

            }">

                {{application.status}}

            </span>

        </div>

        <button

            class="withdraw"

            (click)="withdrawApplication(application.applicationId)">

            Withdraw

        </button>

    </div>

</div>
