<div class="section">

    <div class="header">

        <h2>Saved Jobs</h2>

        <span>{{savedJobs.length}} Saved</span>

    </div>

    <div
        class="saved-card"
        *ngFor="let job of savedJobs">

        <div>

            <h3>{{job.jobTitle}}</h3>

            <p>

                📍 {{job.jobLocation}}

            </p>

            <small>

                Saved on

                {{job.savedAt | date:'dd MMM yyyy'}}

            </small>

        </div>

        <div class="buttons">

            <button
                class="view-btn"
                (click)="viewJob(job.jobId)">

                View

            </button>

            <button
                class="remove-btn"
                (click)="removeJob(job.jobId)">

                Remove

            </button>

        </div>

    </div>

</div>
