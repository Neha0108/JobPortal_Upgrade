<div class="modal-backdrop">
  <div class="form-modal">

    <div class="form-header">
      <h2>{{ isEdit ? 'Edit Job' : 'Post a New Job' }}</h2>
      <button class="close-btn" (click)="cancelled.emit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="alert-error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="job-form" novalidate>

      <!-- Job Title -->
      <div class="field full-width">
        <label>Job Title <span class="req">*</span></label>
        <input type="text" formControlName="jobTitle"
               placeholder="e.g. Senior Backend Engineer"
               [class.err]="invalid('jobTitle')">
        <span class="field-error" *ngIf="invalid('jobTitle')">Job title is required</span>
      </div>

      <!-- Job Description -->
      <div class="field full-width">
        <label>Job Description <span class="req">*</span></label>
        <textarea rows="4" formControlName="jobDescription"
                  placeholder="Describe responsibilities, requirements…"
                  [class.err]="invalid('jobDescription')"></textarea>
        <span class="field-error" *ngIf="invalid('jobDescription')">Description is required</span>
      </div>

      <!-- Location + Category -->
      <div class="field">
        <label>Location <span class="req">*</span></label>
        <input type="text" formControlName="jobLocation"
               placeholder="e.g. Bengaluru, India"
               [class.err]="invalid('jobLocation')">
        <span class="field-error" *ngIf="invalid('jobLocation')">Location is required</span>
      </div>

      <div class="field">
        <label>Category <span class="req">*</span></label>
        <select formControlName="category" [class.err]="invalid('category')">
          <option value="">Select category</option>
          <option *ngFor="let c of categories" [value]="c">
            {{ c.replace('_', ' ') }}
          </option>
        </select>
        <span class="field-error" *ngIf="invalid('category')">Category is required</span>
      </div>

      <!-- Employment Type + Work Mode -->
      <div class="field">
        <label>Employment Type <span class="req">*</span></label>
        <select formControlName="employmentType" [class.err]="invalid('employmentType')">
          <option value="">Select type</option>
          <option *ngFor="let t of employmentTypes" [value]="t">
            {{ t.replace('_', ' ') }}
          </option>
        </select>
        <span class="field-error" *ngIf="invalid('employmentType')">Required</span>
      </div>

      <div class="field">
        <label>Work Mode <span class="req">*</span></label>
        <select formControlName="workMode" [class.err]="invalid('workMode')">
          <option value="">Select mode</option>
          <option *ngFor="let m of workModes" [value]="m">{{ m }}</option>
        </select>
        <span class="field-error" *ngIf="invalid('workMode')">Required</span>
      </div>

      <!-- Salary -->
      <div class="field">
        <label>Min Salary (₹) <span class="req">*</span></label>
        <input type="number" formControlName="minSalary"
               placeholder="e.g. 500000"
               [class.err]="invalid('minSalary')">
        <span class="field-error" *ngIf="invalid('minSalary')">Required</span>
      </div>

      <div class="field">
        <label>Max Salary (₹) <span class="req">*</span></label>
        <input type="number" formControlName="maxSalary"
               placeholder="e.g. 1200000"
               [class.err]="invalid('maxSalary')">
        <span class="field-error" *ngIf="invalid('maxSalary')">Required</span>
      </div>

      <!-- Experience + Vacancies -->
      <div class="field">
        <label>Experience Required (yrs) <span class="req">*</span></label>
        <input type="number" formControlName="experienceRequired"
               min="0" [class.err]="invalid('experienceRequired')">
        <span class="field-error" *ngIf="invalid('experienceRequired')">Required</span>
      </div>

      <div class="field">
        <label>Vacancies <span class="req">*</span></label>
        <input type="number" formControlName="vacancies"
               min="1" [class.err]="invalid('vacancies')">
        <span class="field-error" *ngIf="invalid('vacancies')">Min 1</span>
      </div>

      <!-- Expiry Date + Skill IDs -->
      <div class="field">
        <label>Expiry Date <span class="req">*</span></label>
        <input type="date" formControlName="expiryDate"
               [class.err]="invalid('expiryDate')">
        <span class="field-error" *ngIf="invalid('expiryDate')">Required</span>
      </div>

      <div class="field">
        <label>Skill IDs <small>(comma-separated)</small></label>
        <input type="text" formControlName="skillIdsInput"
               placeholder="e.g. 1, 3, 7">
      </div>

      <!-- Benefits -->
      <div class="field full-width">
        <label>Benefits</label>
        <input type="text" formControlName="benefits"
               placeholder="Health insurance, stock options…">
      </div>

      <!-- Active toggle -->
      <div class="field full-width toggle-row">
        <span class="toggle-label-text">Mark as Active</span>
        <div class="toggle-switch">
          <input type="checkbox" formControlName="active" id="activeToggle">
          <label for="activeToggle"></label>
        </div>
      </div>

      <!-- Footer -->
      <div class="form-footer full-width">
        <button type="button" class="btn-ghost" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="loading" class="spinner-sm"></span>
          {{ isEdit ? 'Save Changes' : 'Post Job' }}
        </button>
      </div>

    </form>
  </div>
</div>
